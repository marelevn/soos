[package]
name = "soos-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Soos desktop app: a document where every line is an expression"

[[bin]]
name = "soos-app"
path = "src/main.rs"

[dependencies]
soos-core = { path = "../soos-core" }

# glow (OpenGL) instead of the default wgpu, whose graphics stack uses much
# more memory while idle. The other default features are listed by hand,
# except `default_fonts`: a few-KB DejaVu subset backs up JetBrains Mono
# instead (see `install_fonts`).
eframe = { version = "0.36", default-features = false, features = [
    "glow",
    "wayland",
    "x11",
    "accesskit",
    "persistence",
] }
serde = { version = "1", features = ["derive"] }
# Already in the binary through soos-core; the update check uses it too.
ureq = { version = "3", features = ["json"] }

# On Linux, `ksni` instead of the default backend, which needs a gtk main
# loop. Without default features, Cargo.lock also skips a gtk dependency
# tree no build here uses.
[target.'cfg(not(target_os = "linux"))'.dependencies]
tray-icon = { version = "0.25", default-features = false }
# Not on Linux, which has no global hotkey; see `FULL_DESKTOP`.
global-hotkey = "0.8"

# To hide the Dock icon with the window; see `show_in_dock`. Both are
# already in the build through eframe and tray-icon.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSApplication",
    "NSResponder",
    "NSRunningApplication",
] }

[target.'cfg(target_os = "linux")'.dependencies]
tray-icon = { version = "0.25", default-features = false, features = ["ksni"] }
# GNOME draws no title bar for a Wayland app; without this feature winit
# draws a plain grey one instead of the Adwaita-style bar.
winit = { version = "0.30", default-features = false, features = ["wayland-csd-adwaita"] }

[build-dependencies]
winresource = "0.1"
